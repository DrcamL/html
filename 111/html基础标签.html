<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML基础标签学习</title>
    <style>
        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "微软雅黑", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2, h3 {
            margin: 20px 0 10px;
            color: #222;
        }
        p {
            margin: 10px 0;
        }
        ul, ol {
            margin: 10px 0 10px 40px;
        }
        table {
            border-collapse: collapse;
            margin: 20px 0;
        }
        td, th {
            border: 1px solid #ddd;
            padding: 8px 16px;
            text-align: center;
        }
        .demo-form {
            margin: 20px 0;
            padding: 16px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        input, textarea, select {
            margin: 8px 0;
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            font-family: inherit;
        }
        button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        /* ========== 底部联系表单模块 ========== */
        .contact-wrap {
            margin-top: 60px;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 12px;
        }
        .contact-wrap h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }
        .contact-form {
            max-width: 500px;
            margin: 0 auto 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .contact-form label {
            font-size: 14px;
            color: #555;
        }
        .contact-form textarea {
            min-height: 100px;
            resize: vertical;
        }
        .submit-btn {
            background-color: #1677ff;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.85;
        }

        /* 快捷联系按钮 */
        .quick-contact {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        .contact-btn {
            display: inline-block;
            margin: 8px 12px;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        .contact-btn:hover {
            opacity: 0.85;
        }
        .tel-btn {
            background-color: #1677ff;
            color: #fff;
        }
        .mail-btn {
            background-color: #52c41a;
            color: #fff;
        }
        .copyright {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- 原有HTML基础标签学习内容 -->
    <h1>HTML 基础标签学习</h1>

    <h2>一、文本标签</h2>
    <p>这是一个段落标签，用于展示正文内容。</p>
    <p><strong>加粗文字</strong>、<em>斜体强调</em>、<u>下划线</u>、<del>删除线</del></p>
    <br>
    <hr>

    <h2>二、列表标签</h2>
    <h3>无序列表</h3>
    <ul>
        <li>HTML 结构</li>
        <li>CSS 样式</li>
        <li>JavaScript 交互</li>
    </ul>

    <h3>有序列表</h3>
    <ol>
        <li>新建文本文件</li>
        <li>编写HTML代码</li>
        <li>保存为.html文件</li>
        <li>浏览器打开预览</li>
    </ol>

    <h2>三、表格标签</h2>
    <table>
        <tr>
            <th>标签</th>
            <th>作用</th>
        </tr>
        <tr>
            <td>h1~h6</td>
            <td>标题标签</td>
        </tr>
        <tr>
            <td>p</td>
            <td>段落标签</td>
        </tr>
        <tr>
            <td>a</td>
            <td>超链接标签</td>
        </tr>
    </table>

    <h2>四、基础表单示例</h2>
    <form class="demo-form">
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name" placeholder="请输入姓名">
        <br>
        <label for="email">邮箱：</label>
        <input type="email" id="email" name="email">
        <br>
        <label>性别：</label>
        <input type="radio" name="gender" value="male"> 男
        <input type="radio" name="gender" value="female"> 女
        <br>
        <label>爱好：</label>
        <input type="checkbox" name="hobby" value="reading"> 阅读
        <input type="checkbox" name="hobby" value="music"> 音乐
        <br>
        <input type="submit" value="提交">
        <input type="reset" value="重置">
    </form>

    <!-- ========== 页面底部：联系表单 + 快捷联系 ========== -->
    <div class="contact-wrap">
        <h3>联系我们</h3>

        <!-- 邮件提交表单：mailto 方案 -->
        <form class="contact-form" 
              action="mailto:service@example.com?subject=网站联系表单提交" 
              method="POST" 
              enctype="text/plain">
            <label for="contact-name">您的姓名</label>
            <input type="text" id="contact-name" name="姓名" placeholder="请输入姓名" required>

            <label for="contact-email">您的邮箱</label>
            <input type="email" id="contact-email" name="联系邮箱" placeholder="请输入邮箱" required>

            <label for="contact-message">留言内容</label>
            <textarea id="contact-message" name="留言" placeholder="请输入您的问题或建议" required></textarea>

            <button type="submit" class="submit-btn">提交并发送邮件</button>
        </form>

        <!-- 快捷联系按钮 -->
        <div class="quick-contact">
            <a class="contact-btn tel-btn" href="tel:+8613800138000">
                📞 客服热线：138-0013-8000
            </a>
            <a class="contact-btn mail-btn" 
               href="mailto:service@example.com?subject=HTML学习页面咨询&body=您好，我想咨询相关问题：">
                📧 直接发送邮件
            </a>
        </div>

        <div class="copyright">© 2026 HTML基础学习页面</div>
    </div>

</body>
</html>
