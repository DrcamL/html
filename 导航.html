<!DOCTYPE html>
<html>
<head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 50px;
        background: #2c3e50;
        color: white;
    }
    
    .logo {
        font-size: 24px;
        font-weight: bold;
    }
    
    .nav-links {
        display: flex;
        list-style: none;
        gap: 30px;
    }
    
    .nav-links a {
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 5px;
        transition: background 0.3s;
    }
    
    .nav-links a:hover {
        background: #34495e;
    }
    
    .nav-links a.active {
        background: #e74c3c;
    }
    
    /* 响应式 - 移动端菜单 */
    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
            padding: 20px;
        }
        
        .nav-links {
            flex-direction: column;
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }
        
        .nav-links li {
            width: 100%;
        }
        
        .nav-links a {
            display: block;
            padding: 12px;
        }
    }
</style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">🏠 MySite</div>
        <ul class="nav-links">
            <li><a href="#" class="active">首页</a></li>
            <li><a href="#">关于</a></li>
            <li><a href="#">服务</a></li>
            <li><a href="#">产品</a></li>
            <li><a href="#">联系</a></li>
        </ul>
    </nav>
</body>
</html>
